<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-label="Spectral orb">
<defs>
<radialGradient id="body" cx="38%" cy="34%" r="72%"><stop offset="0%" stop-color="#ffffff"></stop><stop offset="18%" stop-color="#ffd166"></stop><stop offset="40%" stop-color="#ff7a4d"></stop><stop offset="62%" stop-color="#d13fa0"></stop><stop offset="82%" stop-color="#5f7bff"></stop><stop offset="100%" stop-color="#2a1d5e"></stop></radialGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3fd8e8" stop-opacity="0"></stop><stop offset="30%" stop-color="#3fd8e8" stop-opacity=".9"></stop><stop offset="62%" stop-color="#ffd166" stop-opacity=".9"></stop><stop offset="100%" stop-color="#d13fa0" stop-opacity="0"></stop></linearGradient>
<radialGradient id="halo2" cx="50%" cy="50%" r="50%"><stop offset="60%" stop-color="#9184d9" stop-opacity=".28"></stop><stop offset="100%" stop-color="#9184d9" stop-opacity="0"></stop></radialGradient>
<clipPath id="ball"><circle cx="210" cy="206" r="112"></circle></clipPath>
<filter id="sm"><feGaussianBlur stdDeviation="3"></feGaussianBlur></filter>
<filter id="bands"><feTurbulence type="fractalNoise" baseFrequency="0.004 0.05" numOctaves="3" seed="9" result="t"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="t" scale="18" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
</defs>
<circle cx="210" cy="206" r="180" fill="url(#halo2)"></circle>
<g clip-path="url(#ball)"><g filter="url(#bands)"><circle cx="210" cy="206" r="126" fill="url(#body)"></circle></g></g>
<circle cx="210" cy="206" r="112" fill="none" stroke="#ffffff" stroke-width="1" opacity=".25"></circle>
<ellipse cx="210" cy="212" rx="196" ry="46" fill="none" stroke="url(#ring)" stroke-width="6" transform="rotate(-16 210 212)" filter="url(#sm)"></ellipse>
<ellipse cx="210" cy="212" rx="176" ry="38" fill="none" stroke="#ffffff" stroke-width="1" opacity=".3" transform="rotate(-16 210 212)"></ellipse>
<circle cx="366" cy="132" r="3.2" fill="#ffd166"></circle><circle cx="58" cy="284" r="2.6" fill="#3fd8e8"></circle><circle cx="120" cy="70" r="2" fill="#ffffff" opacity=".7"></circle>
</svg>